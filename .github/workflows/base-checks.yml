name: Base Scene Checks
on:
  push:
  workflow_dispatch:
concurrency:
  group: base-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse the browser from earlier checks
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: base-browser-${{ runner.os }}-playwright-1.58.2
      - name: Install a real browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Keep the browser for the next check
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: base-browser-${{ runner.os }}-playwright-1.58.2
      - name: Run the 7 base checks
        run: node tests/base.check.mjs
      - name: Break tests (checks 2 and 7 must go red when broken)
        run: node tests/break.check.mjs
      - name: Keep the frame-check screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-check-screenshots
          path: test-results/
